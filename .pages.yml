media:
  input: static/images
  output: /images

content:
  - name: articles
    label: Articles
    type: collection
    path: content/articles
    filename: '{slug}.md'
    fields:
      - name: title
        label: Title
        type: string

      - name: category
        label: Category
        type: select
        options:
          values:
            - Spiritual
            - Technical
            - Design
            - Personal Development

      - name: body
        label: Body
        type: rich-text

      - name: date
        label: Date
        type: date

      - name: tags
        label: Tags
        type: string
        list: true

  - name: portfolio
    label: Portfolio
    type: collection
    path: content/portfolio
    filename: '{slug}.md'
    fields:
      - name: title
        label: Title
        type: string

      - name: show-project
        label: Show Project
        type: boolean
        default: true

      - name: enable_preview
        label: Show live preview
        type: boolean
        default: false

      - name: cta_button
        label: CTA Button
        type: object
        fields:
          - name: text
            label: Button Label
            type: string
            default: Live Preview
          - name: url
            label: Button Link
            type: string

      - name: project-number
        label: Project Number
        type: number

      - name: thumbnail
        label: Project Thumbnail
        type: image

      - name: category
        label: Category
        type: select
        options:
          values:
            - Design
            - Development

      - name: body
        label: Body
        type: rich-text

      - name: tags
        label: Tags
        type: string
        list: true

  - name: resources
    label: Resources
    type: collection
    path: content/resources
    filename: '{slug}.md'
    fields:
      - name: title
        label: Title
        type: string

      - name: resource-number
        label: Resource Number
        type: number

      - name: thumbnail
        label: Resource Thumbnail
        type: image

      - name: body
        label: Body
        type: rich-text

      - name: tags
        label: Tags
        type: string
        list: true

      - name: slider_images
        label: Wallpaper Gallery
        type: object
        list: true
        fields:
          - name: image
            label: Wallpaper Image
            type: image

          - name: description
            label: Description / Caption
            type: string
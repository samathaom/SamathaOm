baseURL: "/"
locale: "en-us"
title: "Samatha Om"
theme: "PaperMod"

contentDir: "content"
publishDir: "public"

params:
  env: production
  author: "Samatha Om"
  description: "Technical Leader, Software Architect & Computer Science Educator"
  recentPostsCount: 5
  mainSections:
    - posts
    - articles

  # --- PRODUCTION FIX: Profile Mode Active, HomeInfo Dropped ---
  profileMode:
    enabled: true
    title: "Samatha Om"
    subtitle: "System Architect, Technical Leader & Educator"
    imageUrl: "images/avatar.jpg" # Points directly to static/images/avatar.jpg
    imageWidth: 150
    imageHeight: 150
    imageTitle: "Profile Avatar"
   

  # --- Native PaperMod Theme Settings ---
  ShowCodeCopyButtons: true
  ShowReadingTime: true
  defaultTheme: auto 

# Navigation Menu Configuration
menu:
  main:
    - name: "Articles"
      url: "/articles/"
      weight: 1
    - name: "Projects"
      url: "/projects/"
      weight: 2
    - name: "Resources"
      url: "/resources/"
      weight: 3  
    - name: "Contact"
      url: "/contact/"
      weight: 4

taxonomies:
  tag: "tags"
  category: "categories"
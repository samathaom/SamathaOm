baseURL: "/"
locale: "en-us"
title: "Samatha Om"
theme: "PaperMod"

contentDir: "content"
publishDir: "public"

params:
  env: production  
  description: "Technical Leader, Software Architect & Computer Science Educator"
  author: "Samatha Om"
  avatar: "images/Profilepic.png"
  
  mainSections:
    - portfolio
    - articles
    - resources

  # --- 2. Fixed Social Icons Vector Placement ---
  # Moving this here allows PaperMod's SVG asset injector to find and display them
  # socialIcons:
   # - name: "github"
   #   url: "https://github.com/yourusername"
   # - name: "email"
   #   url: "mailto:your.email@domain.com"

  # --- Native Theme Settings ---
  ShowCodeCopyButtons: true
  ShowReadingTime: true
  defaultTheme: auto 

menu:
  main:
    - name: "Portfolio"
      url: "/portfolio/"
      weight: 1
    - name: "Articles"
      url: "/articles/"
      weight: 2    
    - name: "Resources"
      url: "/resources/"
      weight: 3  
    - name: "Contact"
      url: "/contact/"
      weight: 4
    - name: "Book a Free Call"
      url: "https://cal.com/samathaom/20min"
      weight: 5
      params:
        class: "nav-cta-button"  

taxonomies:
  tag: "tags"
  category: "categories"

markup:
  goldmark:
    renderer:
      unsafe: true
      hardWraps: true

cascade:
  - target:
      kind: page
      path: /resources/**
    params:
      cover:
        image: ":source"

baseURL: "/"
locale: "en-us"
title: "Samatha Om"
theme: "PaperMod" # Replace with your actual theme folder name

# Ensure Hugo looks for content in these specific directories
contentDir: "content"
publishDir: "public"

params:
  env: production
  author: "Samatha Om"
  description: "Technical Leader, Software Architect & Computer Science Educator"
  recentPostsCount: 5
  homeInfoParams:
    Title: "System Architect, Technical Leader and Educator"
    Content: "10 years of engineering, product design, and academic leadership. Focused on minimalist, cost-effective solutions."
    Content: >
      I focus on decomposing complex structural problems into minimalist, highly performant software solutions.
      Over the past decade, my work has spanned software engineering, architectural systems design, and academic curriculum development.
    AlignSocialIconsTo: "left"
     # Inject Profile Mode Globally onto the Homepage Array
  profileMode:
    enabled: true
    title: "Your Name"
    subtitle: "Software Architect & Technology Educator"
    imageUrl: "images/avatar.jpg" # Points to static/images/avatar.jpg
    imageWidth: 150
    imageHeight: 150
    imageTitle: "Profile Avatar"
    buttons:
      - name: "Explore Resources"
        url: "/resources/"
      - name: "Read Journal"
        url: "/posts/"
    socialIcons:
      - name: "github"
        url: "https://github.com/yourusername"
      - name: "linkedin"
        url: "https://linkedin.com/in/yourusername"
      - name: "twitter"
        url: "https://twitter.com/yourusername"
      - name: "email"
        url: "mailto:your.email@domain.com"                  

# 10-minute SEO & Navigation Setup
menu:
  main:
    - name: "Articles"
      url: "/articles"
      weight: 1
    - name: "Projects"
      url: "/projects"
      weight: 2
    - name: "Resources"
      url: "/resources"
      weight: 3  
    - name: "About"
      url: "/about"
      weight: 4
    - name: "Contact"
      url: "/contact"
      weight: 5

# Taxonomies for better organization without extra cost
taxonomies:
  tag: "tags"
  category: "categories"

# Emerging Tech Features
  ShowCodeCopyButtons: true
  ShowReadingTime: true
  defaultTheme: auto # Auto dark/light mode

  canonifyURLs: true
  relativeURLs: false

 
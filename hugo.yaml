baseURL: "/"
locale: "en-us"
title: "Samatha Om"
theme: "PaperMod"

contentDir: "content"
publishDir: "public"

params:
  env: production
  author: "Samatha Om"
  description: "Technical Leader, Software Architect & Computer Science Educator"
  recentPostsCount: 5
  
  # CRITICAL: Tell Hugo which folder holds your journal/articles
  mainSections:
    - articles
    - posts

  # --- Profile Mode Core Configuration ---
  profileMode:
    enabled: true
    title: "Samatha Om"
    subtitle: "System Architect, Technical Leader & Educator"
    imageUrl: "images/avatar.jpg" # Points to static/images/avatar.jpg
    imageWidth: 150
    imageHeight: 150
    imageTitle: "Profile Avatar"
    
    # Theme-native button matrix loop
    buttons:
      - name: "Explore Resources"
        url: "/resources/"
      - name: "Read Journal"
        url: "/articles/"
      - name: "Book a Call"
        url: "https://cal.com/samathaom/20min"

  # --- Native Theme Toggles ---
  ShowCodeCopyButtons: true
  ShowReadingTime: true
  defaultTheme: auto 

menu:
  main:
    - name: "Articles"
      url: "/articles/"
      weight: 1
    - name: "Projects"
      url: "/projects/"
      weight: 2
    - name: "Resources"
      url: "/resources/"
      weight: 3  
    - name: "Contact"
      url: "/contact/"
      weight: 4

taxonomies:
  tag: "tags"
  category: "categories"
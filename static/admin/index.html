<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager</title>
</head>
<body>
  <!-- This script MUST run before the CMS script is loaded -->
  <script>
    // 1. Tell Decap NOT to start automatically
    window.CMS_MANUAL_INIT = true;

    // 2. Extract token from URL (handles both #/ and #)
    const hash = window.location.hash;
    const token = hash.includes('access_token=') ? hash.split('access_token=')[1] : null;

    if (token) {
      // 3. Load the CMS core library dynamically
      const script = document.createElement('script');
      script.src = "https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js";
      document.body.appendChild(script);

      script.onload = () => {
        // 4. Manually trigger the CMS with your token
        window.CMS.init({
          config: {
            backend: {
              name: "github",
              repo: "samathaom/SamathaOm", // UPDATE THIS
              branch: "main",
              auth_type: "token", 
              token: token
            },
            // Ensure this points to your actual config.yml location
            load_config_file: true 
          }
        });
      };
    } else {
      // If no token, show your password gate UI here
      document.body.innerHTML = "<h1>Unauthorized. Please request a Magic Link.</h1>";
    }
  </script>
</body>
</html>

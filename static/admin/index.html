<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Content Manager</title>
</head>
<body>
  <div id="status-msg" style="text-align:center; margin-top:50px; font-family:sans-serif;">
    Checking credentials...
  </div>

  <script>
    // 1. Block the default Netlify/Decap login popup
    window.CMS_MANUAL_INIT = true;

    // 2. Extract and CLEAN the token
    const fullHash = window.location.hash;
    // This regex finds the token even if there are slashes or other junk
    const tokenMatch = fullHash.match(/access_token=([^&/]+)/);
    const token = tokenMatch ? tokenMatch[1] : null;

    if (token) {
      document.getElementById('status-msg').innerText = "Authenticating with GitHub...";
      
      const script = document.createElement('script');
      script.src = "https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js";
      document.body.appendChild(script);

      script.onload = () => {
        window.CMS.init({
          config: {
            backend: {
              name: "github",
              repo: "samathaom/SamathaOm", // <--- DOUBLE CHECK THIS
              branch: "main",
              auth_type: "token",
              token: token
            },
            load_config_file: true
          }
        });

        // Add this inside your script.onload after window.CMS.init
          CMS.registerPreviewStyle("https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css");

          // This creates a "Real-Time" bridge for your Markdown
          var PostPreview = createClass({
            render: function() {
              var entry = this.props.entry;
              var image = entry.getIn(['data', 'thumbnail']); // or your image field name
              var bg = this.props.getAsset(image);

              return h('div', {className: "content"},
                h('h1', {}, entry.getIn(['data', 'title'])),
                h('img', {src: bg ? bg.toString() : ''}),
                h('div', {}, this.props.widgetFor('body'))
              );
            }
          });

          CMS.registerPreviewTemplate("blog", PostPreview);

        document.getElementById('status-msg').style.display = 'none';
      };
    } else {
      document.getElementById('status-msg').innerHTML = 
        "<h2 style='color:red;'>Unauthorized</h2><p>No valid token found in URL. Please use the link sent to your email.</p>";
    }
  </script>
</body>
</html>

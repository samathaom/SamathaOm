backend:
  name: github
  repo: samathaom/SamathaOm # REPLACE WITH YOUR REPO
  branch: main
  base_url: https://samathaom.vercel.app
  auth_type: token
  auth_endpoint: api/auth
  display_url: https://samathaom.vercel.app
  publish_mode: editorial_workflow
  media_folder: "static/images"
  public_folder: "/images"
 
collections:
  - name: "articles"
    label: "Articles"
    folder: "content/articles"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "projects"
    label: "Projects"
    folder: "content/projects"
    create: true
    fields:
      - {label: "Project Title", name: "title", widget: "string"}
      - {label: "Thumbnail", name: "thumbnail", widget: "image"}
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "pages"
    label: "Pages"
    files:
      - file: "content/about.md"
        label: "About Me"
        name: "about"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Body", name: "body", widget: "markdown"}
      # CONTACT PAGE UPDATED FOR FORMSPREE
      - file: "content/contact.md"
        label: "Contact"
        name: "contact"
        fields:
          - {label: "Title", name: "title", widget: "string", default: "Contact Me"}
          - {label: "Formspree Endpoint ID", name: "formspree_id", widget: "string", hint: "Just the ID from your Formspree URL"}
          - {label: "Intro Text", name: "body", widget: "markdown", hint: "Text to show above the form"}
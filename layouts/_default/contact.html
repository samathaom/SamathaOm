{{ define "main" }}
<article class="post-single">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
  </header>
  
  <div class="post-content">
    {{ .Content }}
    
    <form id="contact-form" action="https://formspree.io/f/{{ .Params.formspree_id }}" method="POST" style="margin-top: 20px;">
      
      <!-- Spam Protection -->
      <input type="text" name="_gotcha" style="display:none !important" tabIndex="-1" autocomplete="off">

      <div style="margin-bottom: 15px;">
        <label for="name" style="display:block; font-weight:bold;">Name</label>
        <input type="text" id="name" name="name" required style="width: 100%; padding: 10px; background: var(--entry); color: var(--primary); border: 1px solid var(--border); border-radius: 4px;">
      </div>

      <div style="margin-bottom: 15px;">
        <label for="email" style="display:block; font-weight:bold;">Email ID</label>
        <input type="email" id="email" name="_replyto" required style="width: 100%; padding: 10px; background: var(--entry); color: var(--primary); border: 1px solid var(--border); border-radius: 4px;">
        <small id="email-hint" style="color: #ff4d4d; display: none;">Please enter a valid email (e.g., name@domain.com)</small>
      </div>

      <div style="margin-bottom: 15px;">
        <label for="subject" style="display:block; font-weight:bold;">Subject</label>
        <input type="text" id="subject" name="subject" required style="width: 100%; padding: 10px; background: var(--entry); color: var(--primary); border: 1px solid var(--border); border-radius: 4px;">
      </div>

      <div style="margin-bottom: 15px;">
        <label for="description" style="display:block; font-weight:bold;">Description</label>
        <textarea id="description" name="description" required style="width: 100%; padding: 10px; background: var(--entry); color: var(--primary); border: 1px solid var(--border); border-radius: 4px; min-height: 120px;"></textarea>
      </div>

      <button type="submit" id="submit-btn" disabled style="background: var(--secondary); color: var(--theme); padding: 12px 24px; border: none; border-radius: 4px; cursor: not-allowed; width: 100%; opacity: 0.5; transition: all 0.3s ease;">
        Submit
      </button>

    </form>
  </div>
</article>

<script>
  const form = document.getElementById('contact-form');
  const btn = document.getElementById('submit-btn');
  const emailInput = document.getElementById('email');
  const emailHint = document.getElementById('email-hint');
  const requiredInputs = form.querySelectorAll('input[required], textarea[required]');

  // Regex for strict email validation: requires @ and a TLD (like .com, .in, .org)
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

  form.addEventListener('input', () => {
    let allFilled = true;
    let emailValid = emailRegex.test(emailInput.value);

    // 1. Check if all required fields have content
    requiredInputs.forEach(input => {
      if (!input.value.trim()) {
        allFilled = false;
      }
    });

    // 2. Show/Hide email hint for better UX
    if (emailInput.value.length > 5 && !emailValid) {
      emailHint.style.display = 'block';
    } else {
      emailHint.style.display = 'none';
    }

    // 3. Toggle Button State
    if (allFilled && emailValid) {
      btn.disabled = false;
      btn.style.cursor = 'pointer';
      btn.style.opacity = '1';
      btn.style.background = 'var(--primary)';
    } else {
      btn.disabled = true;
      btn.style.cursor = 'not-allowed';
      btn.style.opacity = '0.5';
      btn.style.background = 'var(--secondary)';
    }
  });
</script>
{{ end }}

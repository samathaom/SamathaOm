{{ define "main" }}
<article class="post-single">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
  </header>
  
  <div class="post-content">
    {{ .Content }}
    
    <form id="contact-form" action="https://formspree.io/f/{{ .Params.formspree_id }}" method="POST" style="margin-top: 20px;">
      
      <!-- Spam Protection -->
      <input type="text" name="_gotcha" style="display:none !important" tabIndex="-1" autocomplete="off">

      <div style="margin-bottom: 15px;">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required style="width: 100%; padding: 10px; background: var(--entry); color: var(--primary); border: 1px solid var(--border);">
      </div>

      <div style="margin-bottom: 15px;">
        <label for="email">Email ID</label>
        <input type="email" id="email" name="_replyto" required style="width: 100%; padding: 10px; background: var(--entry); color: var(--primary); border: 1px solid var(--border);">
      </div>

      <div style="margin-bottom: 15px;">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" required style="width: 100%; padding: 10px; background: var(--entry); color: var(--primary); border: 1px solid var(--border);">
      </div>

      <div style="margin-bottom: 15px;">
        <label for="description">Description</label>
        <textarea id="description" name="description" required style="width: 100%; padding: 10px; background: var(--entry); color: var(--primary); border: 1px solid var(--border); min-height: 120px;"></textarea>
      </div>

      <button type="submit" id="submit-btn" disabled style="background: var(--secondary); color: var(--theme); padding: 12px 24px; border: none; border-radius: 4px; cursor: not-allowed; width: 100%; opacity: 0.5;">
        Submit Message
      </button>

    </form>
  </div>
</article>

<script>
  const form = document.getElementById('contact-form');
  const btn = document.getElementById('submit-btn');
  const inputs = form.querySelectorAll('input[required], textarea[required]');

  form.addEventListener('input', () => {
    let isValid = true;
    inputs.forEach(input => {
      if (!input.value.trim() || (input.type === 'email' && !input.checkValidity())) {
        isValid = false;
      }
    });

    if (isValid) {
      btn.disabled = false;
      btn.style.cursor = 'pointer';
      btn.style.opacity = '1';
      btn.style.background = 'var(--primary)';
    } else {
      btn.disabled = true;
      btn.style.cursor = 'not-allowed';
      btn.style.opacity = '0.5';
      btn.style.background = 'var(--secondary)';
    }
  });
</script>
{{ end }}

{{ define "main" }}
<article class="post-single">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
    {{- partial "post_meta.html" . -}}
  </header>

  <div class="post-content">
    {{ if .Params.gallery }}
    <!-- Minimalist Slider Container -->
    <div class="minimal-slider-container">
      <div class="minimal-slider">
        {{ range $index, $item := .Params.gallery }}
        <div class="slider-slide {{ if eq $index 0 }}active{{ end }}">
          <div class="image-wrapper">
            <img src="{{ $item.image | relURL }}" alt="Wallpaper Preview" loading="lazy">
          </div>
          <div class="slide-caption">
            {{ $item.description | markdownify }}
          </div>
        </div>
        {{ end }}
      </div>

      <!-- Navigation Arrows -->
      <button class="slider-arrow prev" aria-label="Previous Slide" onclick="moveSlide(-1)">&#8592;</button>
      <button class="slider-arrow next" aria-label="Next Slide" onclick="moveSlide(1)">&#8594;</button>
    </div>
    {{ end }}

    {{ .Content }}
  </div>
</article>

<style>
  .minimal-slider-container {
    position: relative;
    width: 100%;
    margin: 0 auto 3rem auto;
    display: block;
    clear: both;
  }

  .minimal-slider {
    position: relative;
    overflow: hidden;
    width: 100%;
  }

  .slider-slide {
    display: none;
    width: 100%;
    animation: fadeIn 0.3s ease-in-out;
  }

  .slider-slide.active {
    display: block;
  }

  .image-wrapper {
    width: 100%;
    height: 450px;
    background: var(--code-bg);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 1rem;
    box-sizing: border-box;
  }

  .image-wrapper img {
    max-width: 100%;
    max-height: 100%;
    height: auto;
    width: auto;
    display: block;
    object-fit: contain;
  }

  .slide-caption {
    margin-top: 1.2rem;
    font-size: 0.95rem;
    color: var(--secondary);
    line-height: 1.6;
    text-align: left;
  }

  .slider-arrow {
    position: absolute;
    top: 225px;
    transform: translateY(-50%);
    background: none;
    border: none;
    font-size: 1.5rem;
    color: var(--primary);
    cursor: pointer;
    padding: 10px;
    opacity: 0.4;
    transition: opacity 0.2s ease;
    user-select: none;
    z-index: 10;
  }

  .slider-arrow:hover {
    opacity: 1;
  }

  .slider-arrow.prev { left: -40px; }
  .slider-arrow.next { right: -40px; }

  /* Enforces PaperMod Content Spacing Patterns */
  .post-content h3 {
    margin-top: 2.5rem !important;
    margin-bottom: 1rem !important;
  }

  .post-content p {
    margin-bottom: 1.5rem !important;
  }

  .post-content ul, .post-content ol {
    margin-top: 1rem !important;
    margin-bottom: 1.5rem !important;
    padding-left: 2rem !important;
    list-style: disc outside !important;
  }

  .post-content li {
    margin-bottom: 0.5rem !important;
    padding-left: 0.25rem !important;
    display: list-item !important;
  }

  @media (min-width: 768px) {
    .image-wrapper {
      height: 550px;
    }
    .slider-arrow {
      top: 275px;
    }
  }

  @media (max-width: 768px) {
    .slider-arrow.prev { left: 10px; }
    .slider-arrow.next { right: 10px; }
    .slider-arrow {
      background: var(--theme);
      opacity: 0.8;
    }
  }

  @keyframes fadeIn {
    from { opacity: 0.4; }
    to { opacity: 1; }
  }
</style>

<script>
  let currentSlideIndex = 0;

  function moveSlide(direction) {
    const slides = document.querySelectorAll('.slider-slide');
    if (!slides.length) return;

    slides[currentSlideIndex].classList.remove('active');
    currentSlideIndex += direction;
    
    if (currentSlideIndex >= slides.length) {
      currentSlideIndex = 0;
    } else if (currentSlideIndex < 0) {
      currentSlideIndex = slides.length - 1;
    }
    
    slides[currentSlideIndex].classList.add('active');
  }
</script>
{{ end }}

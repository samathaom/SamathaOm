{{ define "main" }}
<article class="post-single">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
    {{- partial "post_meta.html" . -}}
  </header>

  <div class="post-content">
    {{ if .Params.gallery }}
    <!-- Minimalist Slider Container with Safe Padding -->
    <div class="minimal-slider-container">
      <button class="slider-arrow prev" aria-label="Previous Slide" onclick="moveSlide(-1)">&#8592;</button>
      
      <div class="minimal-slider">
        {{ range $index, $item := .Params.gallery }}
        <div class="slider-slide {{ if eq $index 0 }}active{{ end }}">
          <div class="image-wrapper">
            <img src="{{ $item.image | relURL }}" alt="Wallpaper Preview" loading="lazy">
          </div>
          <div class="slide-caption">
            {{ $item.description | markdownify }}
          </div>
        </div>
        {{ end }}
      </div>

      <button class="slider-arrow next" aria-label="Next Slide" onclick="moveSlide(1)">&#8594;</button>
    </div>
    {{ end }}

    {{ .Content }}
  </div>
</article>

<style>
  .minimal-slider-container {
    position: relative;
    width: 100%;
    margin: 2rem 0;
    padding: 0 45px;
    box-sizing: border-box;
  }

  .minimal-slider {
    position: relative;
    overflow: hidden;
    width: 100%;
  }

  .slider-slide {
    display: none;
    width: 100%;
    animation: fadeIn 0.3s ease-in-out;
  }

  .slider-slide.active {
    display: block;
  }

  .image-wrapper {
    width: 100%;
    height: 450px;
    background: var(--code-bg);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 1rem;
    box-sizing: border-box;
  }

  .image-wrapper img {
    max-width: 100%;
    max-height: 100%;
    height: auto;
    width: auto;
    display: block;
    object-fit: contain;
  }

  .slide-caption {
    margin-top: 1.2rem;
    font-size: 0.95rem;
    color: var(--secondary);
    line-height: 1.6;
    text-align: left;
  }

  .slider-arrow {
    position: absolute;
    top: calc(225px + 1rem);
    transform: translateY(-50%);
    background: none;
    border: none;
    font-size: 1.5rem;
    color: var(--primary);
    cursor: pointer;
    padding: 8px;
    opacity: 0.4;
    transition: opacity 0.2s ease;
    user-select: none;
    z-index: 10;
  }

  .slider-arrow:hover {
    opacity: 1;
  }

  .slider-arrow.prev { left: 8px; }
  .slider-arrow.next { right: 8px; }

  @media (min-width: 768px) {
    .image-wrapper {
      height: 550px;
    }
    .slider-arrow {
      top: calc(275px + 1rem);
    }
  }

  @media (max-width: 768px) {
    .minimal-slider-container {
      padding: 0 35px;
    }
    .slider-arrow.prev { left: 2px; }
    .slider-arrow.next { right: 2px; }
  }

  @keyframes fadeIn {
    from { opacity: 0.4; }
    to { opacity: 1; }
  }
</style>

<script>
  let currentSlideIndex = 0;

  function moveSlide(direction) {
    const slides = document.querySelectorAll('.slider-slide');
    if (!slides.length) return;

    slides[currentSlideIndex].classList.remove('active');
    currentSlideIndex += direction;
    
    if (currentSlideIndex >= slides.length) {
      currentSlideIndex = 0;
    } else if (currentSlideIndex < 0) {
      currentSlideIndex = slides.length - 1;
    }
    
    slides[currentSlideIndex].classList.add('active');
  }
</script>
{{ end }}

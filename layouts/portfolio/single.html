{{ define "main" }}
<article class="post-single">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
    {{- partial "post_meta.html" . -}}
  </header>

  <div class="post-content">
    
    <!-- Live Preview Button on Case Study Page -->
        {{ if .Params.enable_preview }}
        {{ with .Params.cta_button }}
            <div style="margin: 24px 0;">
            <a href="{{ .url }}" target="_blank" rel="noopener noreferrer" class="btn-live-preview">
                {{ Live Preview }} ↗
            </a>
            </div>
        {{ end }}
        {{ end }}

    {{ .Content }}

  </div>
</article>


{{ end }}

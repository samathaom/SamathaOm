{{ define "main" }}
<article class="post-single">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
    {{- partial "post_meta.html" . -}}
  </header>

  <div class="post-content">
    
    <!-- Live Preview Button -->
    {{ if .Params.enable_preview }}
      {{ with .Params.cta_button }}
        <div class="preview-button-wrapper">
          <a href="{{ .url }}" target="_blank" rel="noopener noreferrer" class="btn-live-preview">
            {{ .text | default "Live Preview" }} ↗
          </a>
        </div>
      {{ end }}
    {{ end }}

    <!-- Case Study Body Content -->
    {{ .Content }}

  </div>

  <!-- Portfolio Tags & Footer -->
  <footer class="post-footer">
    {{- partial "post_tags.html" . -}}
    {{- partial "post_nav.html" . -}}
  </footer>
</article>
{{ end }}
